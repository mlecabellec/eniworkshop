name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout MkDocs Kit
        uses: actions/checkout@v4
        with:
          repository: mlecabellec/mkdocs-kit
          path: mkdocs-kit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install mkdocs mkdocs-material weasyprint wireviz nwdiag bit_field

      - name: Build Documentation
        env:
          MKDOCS_KIT_BIN: ${{ github.workspace }}/mkdocs-kit/mkdocs-kit
        run: ./helpers/build-docs.sh build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
